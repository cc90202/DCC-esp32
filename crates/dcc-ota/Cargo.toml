[package]
edition.workspace      = true
name                   = "dcc-ota"
publish.workspace      = true
rust-version.workspace = true
version                = "0.1.0"
description            = "Signed over-the-air update logic for the DCC command station, free of any HAL."

[lints]
workspace = true

[dependencies]
dcc-ota-format   = { workspace = true }
ed25519-dalek    = { workspace = true }
embedded-storage = { workspace = true }
heapless         = { workspace = true }

[dev-dependencies]
dcc-ota-format = { workspace = true, features = ["test-support"] }
serde_json     = "1"
