name: quality-gate

on:
  pull_request:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-and-esp-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf, x86_64-unknown-linux-gnu
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Host unit tests
        run: cargo test-host

      - name: ESP target compile check
        run: cargo check-esp

      - name: Build ESP release firmware
        run: cargo build-esp-release

      - name: Verify ISR placement in internal RAM
        run: bash scripts/check-isr-ram.sh

      - name: Clippy host targets
        run: cargo clippy-host -- -D warnings

      - name: Clippy riscv32 lib
        run: cargo clippy --lib --target riscv32imac-unknown-none-elf -- -D warnings

      # Compiles the bench-diag configuration, whose call sites all live in
      # firmware-only modules and are therefore never built by the host jobs.
      - name: Clippy riscv32 bench-diag
        run: cargo clippy-esp -- -D warnings
