name: quality-gate

on:
  pull_request:
  push:
    branches: [ develop, main ]
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-and-esp-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv32imac-unknown-none-elf, x86_64-unknown-linux-gnu
          components: rustfmt, clippy, llvm-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: OTA host tool tests
        run: cargo test -p ota-pack --target x86_64-unknown-linux-gnu

      - name: Pin bootloader and reviewed public keys
        run: |
          sha256sum --check <<'EOF'
          402c2c64761034e10b36ca8699d641e2bc0c86fd245a859d78e1aae4e2d201cd  bootloader/esp32c6-bootloader.bin
          333d21df8f456306b81716b63ce1be59d6d974d41b3d28dc7dce21d78394d052  keys/ota_release.pub
          EOF

      # Warnings are denied for this package in Cargo.toml (`[lints.rust]`), so
      # every compiling step below fails on a warning. RUSTFLAGS is deliberately
      # not used: the environment variable replaces the target rustflags in
      # .cargo/config.toml, which carry the linker scripts, and the firmware
      # would fail to link instead of failing the lint.
      - name: Host unit tests
        run: cargo test-host

      - name: ESP target compile check
        run: cargo check-esp

      - name: Build ESP release firmware
        run: cargo build-esp-release

      - name: Install pinned image converter
        run: cargo install espflash --version 4.3.0 --locked

      # Temporary signer exercises real image validation, not release signing.
      # Explicit rotation allows the production embedded public key while the
      # signature belongs only to a disposable CI key. Never publish this file.
      - name: Non-merged release image and disposable package roundtrip
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          espflash save-image --chip esp32c6 --flash-size 8mb \
            --bootloader bootloader/esp32c6-bootloader.bin \
            --partition-table partitions.csv --target-app-partition ota_0 \
            target/riscv32imac-unknown-none-elf/release/dcc-esp32 "$tmp/app.bin"
          cargo ota-pack keygen --private "$tmp/test.key" --public "$tmp/test.pub"
          cargo ota-pack sign --key "$tmp/test.key" --rotate-to keys/ota_release.pub \
            --image "$tmp/app.bin" --out "$tmp/test-only.dccfw"
          cargo ota-pack inspect "$tmp/test-only.dccfw"
          cargo ota-pack verify "$tmp/test-only.dccfw" --public "$tmp/test.pub"
          if cargo ota-pack verify "$tmp/test-only.dccfw" --public keys/ota_release.pub; then
            echo 'Disposable signature unexpectedly accepted by production key' >&2
            exit 1
          fi
          cargo ota-pack extract "$tmp/test-only.dccfw" --out "$tmp/extracted.bin"
          cmp "$tmp/app.bin" "$tmp/extracted.bin"

      - name: Verify ISR placement in internal RAM
        run: |
          bash scripts/check-isr-ram.sh --self-test
          bash scripts/check-isr-ram.sh

      # Intra-doc links break silently when a module's visibility changes: none
      # of the jobs above build documentation, so a link to a module that has
      # just become private stays green everywhere else.
      - name: Documentation links
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo doc --workspace --no-deps --target x86_64-unknown-linux-gnu
          cargo doc --no-deps --target riscv32imac-unknown-none-elf

      - name: Clippy host targets
        run: cargo clippy-host -- -D warnings

      - name: Clippy riscv32 lib
        run: cargo clippy --lib --target riscv32imac-unknown-none-elf -- -D warnings

      # Includes bench-diag and OTA fault/dev-key. This is NOT a release
      # signing configuration; the default release above is built separately.
      - name: Clippy riscv32 all features (bench/fault only)
        run: cargo clippy-esp -- -D warnings

  # Complexity, module structure, duplication, dependency audit and spelling.
  # The local entry point for the same checks is scripts/check-all.sh.
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: 1.99.0
          targets: riscv32imac-unknown-none-elf, x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2

      - name: Install Node.js for jscpd
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.21.0

      - name: Install prebuilt analysis tools
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny@0.20.2,typos@1.51.1,cargo-machete@0.9.1
          fallback: none

      # No prebuilt release in install-action's list: cargo-binstall fetches one
      # when available and builds from source otherwise (kept by the cache).
      - name: Install module and complexity analysers
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-modules@0.27.0,rust-code-analysis-cli@0.0.25

      # The complexity and module-cycle allowlists may only shrink relative to
      # the target branch.
      - name: Fetch the base branch
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Cognitive complexity
        env:
          COMPLEXITY_BASE: origin/${{ github.base_ref || 'main' }}
        run: bash scripts/check-complexity.sh

      - name: Module dependencies
        env:
          CYCLE_BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          bash scripts/check-module-deps.sh --self-test
          bash scripts/check-module-deps.sh

      - name: Duplicated code
        run: bash scripts/check-duplication.sh jscpd

      - name: Unused dependencies
        run: bash scripts/check-duplication.sh machete

      - name: Dependency audit
        run: cargo deny --workspace check

      - name: Spelling
        run: typos src crates tools scripts
