[package]
edition.workspace      = true
name                   = "dcc-esp32"
publish.workspace      = true
rust-version.workspace = true
version                = "0.1.0"

[workspace]
members         = [".", "crates/dcc-ota", "crates/dcc-ota-format", "crates/dcc-protocol", "crates/dcc-provisioning", "crates/z21", "tools/ota-pack"]
default-members = ["."]
resolver        = "3"

# Shared by every member. `version` stays per crate on purpose: the firmware
# reports its own package version as the running release, and bumping it must
# not re-version the update crates or the packaging tool.
[workspace.package]
edition      = "2024"
publish      = false
rust-version = "1.88"

# Versions shared by the firmware and the update crates.
[workspace.dependencies]
dcc-ota          = { path = "crates/dcc-ota" }
dcc-ota-format   = { path = "crates/dcc-ota-format" }
dcc-protocol     = { path = "crates/dcc-protocol" }
dcc-provisioning = { path = "crates/dcc-provisioning" }
defmt            = "1.0.1"
ed25519-dalek    = { version = "2.2", default-features = false }
embedded-storage = "0.3.1"
heapless         = "0.9"
sha2             = { version = "0.10", default-features = false }
z21              = { path = "crates/z21" }

# Warnings are errors for every member's own code, in every build and on every
# target. Declared here rather than through RUSTFLAGS because the environment
# variable replaces the target rustflags in .cargo/config.toml, which carry the
# linker scripts: setting it there silently breaks the firmware link instead of
# tightening a lint.
[workspace.lints.rust]
warnings = "deny"
missing_debug_implementations = "warn"
redundant_imports             = "warn"
redundant_lifetimes           = "warn"
trivial_numeric_casts         = "warn"
unreachable_pub               = "warn"
unused_lifetimes              = "warn"
unused_qualifications         = "warn"

# Lints beyond the default set; `warnings = "deny"` above makes each an error.
# Unwrap, expect and panic stay allowed in test code (see clippy.toml).
[workspace.lints.clippy]
# Panics, unchecked arithmetic and casts outside tests.
cast_lossless               = "warn"
expect_used                 = "warn"
panic                       = "warn"
unchecked_time_subtraction  = "warn"
unwrap_used                 = "warn"
# Unfinished or debugging code.
dbg_macro                   = "warn"
todo                        = "warn"
unimplemented               = "warn"
# Unsafe: one operation per block, each with its `// SAFETY:` comment.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks  = "warn"
mem_forget                  = "warn"
# Suppressions: `#[expect(..., reason = "...")]`, never `#[allow]`.
allow_attributes            = "warn"
allow_attributes_without_reason = "warn"
# A new enum variant must reach every match on its enum.
wildcard_enum_match_arm     = "warn"
# Parameter passing.
needless_pass_by_ref_mut    = "warn"
needless_pass_by_value      = "warn"
redundant_clone             = "warn"
trivially_copy_pass_by_ref  = "warn"
unused_async                = "warn"
# Idioms.
default_trait_access        = "warn"
explicit_iter_loop          = "warn"
ignored_unit_patterns       = "warn"
manual_let_else             = "warn"
manual_midpoint             = "warn"
map_unwrap_or               = "warn"
or_fun_call                 = "warn"
range_plus_one              = "warn"
single_match_else           = "warn"
uninlined_format_args       = "warn"
unnested_or_patterns        = "warn"
unreadable_literal          = "warn"
use_self                    = "warn"

[lints]
workspace = true

[features]
default = []

# Bench diagnostics: per-window and per-command defmt logging plus the periodic
# RailCom counter dump.
#
# Off by default on purpose. Every defmt line is emitted inside a critical
# section (esp-println takes the global logger lock, disables interrupts, then
# writes the frame to the USB-serial FIFO, spinning if the FIFO is full). The
# DCC waveform ISR and the RailCom cutout timer both run at Priority3, so a log
# line on a per-packet path adds interrupt latency exactly where cutout timing
# is measured in microseconds. Enable only for bench sessions:
#
#     cargo run --release --features bench-diag
bench-diag = []
# Bench only: a build that fails on purpose during its trial, to exercise
# the rollback. Not additive; never enable it for a release build.
ota-fault-inject = []

[[bin]]
name = "dcc-esp32"
path = "./src/bin/main.rs"

[dependencies]
# Platform-independent dependencies (available in tests)
dcc-ota          = { workspace = true }
dcc-ota-format   = { workspace = true }
dcc-protocol     = { workspace = true }
dcc-provisioning = { workspace = true }
heapless         = { workspace = true }
embedded-storage = { workspace = true }
z21              = { workspace = true }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

# ESP32-specific dependencies (only compiled for RISC-V target, not for host tests)
[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "1.2.0"
ed25519-dalek    = { workspace = true }
esp-hal = { version = "~1.0", features = ["defmt", "esp32c6", "unstable"] }
ssd1306 = { version = "0.10", features = ["async"] }
embedded-graphics = "0.8"
heapless = { workspace = true, features = ["defmt"] }
dcc-protocol = { workspace = true, features = ["defmt"] }
dcc-provisioning = { workspace = true, features = ["defmt"] }
z21 = { workspace = true, features = ["defmt"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

defmt                  = { workspace = true }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }
esp-storage = { version = "0.8.1", features = ["defmt", "esp32c6"] }

esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32c6"] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = "0.1.2"

static_cell      = "2.1.1"

# Network stack (WiFi Z21 UDP)
esp-radio         = { version = "0.17.0", features = ["esp32c6", "wifi", "unstable"] }
embassy-net       = { version = "0.8.0",  features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embedded-io-async = { version = "0.7.0",  features = ["defmt"] }

# Host-only: these are for the unit tests, which run on the development machine.
# Declared under a target cfg because embassy-time here carries the `std`
# feature: unconditional dev-dependencies are pulled in whenever any tool builds
# test targets for riscv32, and `std` does not exist on a bare-metal target.
# The Embassy crates repeat the firmware's declarations with host features; the
# two target sections cannot share one `workspace = true` entry. `heapless`
# comes from the platform-independent dependencies above; `dcc-protocol` is
# repeated to add its test-only validator and constructors.
[target.'cfg(not(target_arch = "riscv32"))'.dev-dependencies]
dcc-protocol = { workspace = true, features = ["test-support"] }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
incremental = false

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
