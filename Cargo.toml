[package]
edition      = "2024"
name         = "dcc-esp32"
publish      = false
rust-version = "1.88"
version      = "0.1.0"

[workspace]
members         = [".", "crates/dcc-ota", "crates/dcc-ota-format", "tools/ota-pack"]
default-members = ["."]
resolver        = "3"

# Versions shared by the firmware and the update crates.
[workspace.dependencies]
dcc-ota          = { path = "crates/dcc-ota" }
dcc-ota-format   = { path = "crates/dcc-ota-format" }
ed25519-dalek    = { version = "2.2", default-features = false }
embedded-storage = "0.3.1"
heapless         = "0.9"
sha2             = { version = "0.10", default-features = false }

# Warnings are errors for this package's own code, in every build and on every
# target. Declared here rather than through RUSTFLAGS because the environment
# variable replaces the target rustflags in .cargo/config.toml, which carry the
# linker scripts: setting it there silently breaks the firmware link instead of
# tightening a lint.
[lints.rust]
warnings = "deny"

[features]
default = []

# Bench diagnostics: per-window and per-command defmt logging plus the periodic
# RailCom counter dump.
#
# Off by default on purpose. Every defmt line is emitted inside a critical
# section (esp-println takes the global logger lock, disables interrupts, then
# writes the frame to the USB-serial FIFO, spinning if the FIFO is full). The
# DCC waveform ISR and the RailCom cutout timer both run at Priority3, so a log
# line on a per-packet path adds interrupt latency exactly where cutout timing
# is measured in microseconds. Enable only for bench sessions:
#
#     cargo run --release --features bench-diag
bench-diag = []
# Bench only: a build that fails on purpose during its trial, to exercise
# the rollback. Not additive; never enable it for a release build.
ota-fault-inject = []

[[bin]]
name = "dcc-esp32"
path = "./src/bin/main.rs"

[dependencies]
# Platform-independent dependencies (available in tests)
dcc-ota          = { workspace = true }
dcc-ota-format   = { workspace = true }
heapless         = { workspace = true }
embedded-storage = { workspace = true }
smoltcp          = { version = "0.12.0", default-features = false, features = ["medium-ethernet", "proto-dhcpv4", "socket-dhcpv4"] }

[target.'cfg(not(target_arch = "riscv32"))'.dependencies]
critical-section = { version = "1.2.0", features = ["std"] }

# ESP32-specific dependencies (only compiled for RISC-V target, not for host tests)
[target.'cfg(target_arch = "riscv32")'.dependencies]
critical-section = "1.2.0"
ed25519-dalek    = { workspace = true }
esp-hal = { version = "~1.0", features = ["defmt", "esp32c6", "unstable"] }
ssd1306 = { version = "0.10", features = ["async"] }
embedded-graphics = "0.8"
heapless = { workspace = true, features = ["defmt"] }

esp-rtos = { version = "0.2.0", features = [
  "defmt",
  "embassy",
  "esp-alloc",
  "esp-radio",
  "esp32c6",
] }

defmt                  = "1.0.1"
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32c6"] }
esp-storage = { version = "0.8.1", features = ["defmt", "esp32c6"] }

esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32c6"] }
embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = { version = "0.5.0", features = ["defmt"] }
embassy-sync = { version = "0.7.2", features = ["defmt"] }
embassy-futures = "0.1.2"

static_cell      = "2.1.1"

# Network stack (WiFi Z21 UDP)
esp-radio         = { version = "0.17.0", features = ["esp32c6", "wifi", "unstable"] }
embassy-net       = { version = "0.8.0",  features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
embedded-io-async = { version = "0.7.0",  features = ["defmt"] }

[dev-dependencies]
# For running tests on host platform
heapless = { workspace = true }
embassy-futures = "0.1.2"
embassy-sync = "0.7.2"
embassy-time = { version = "0.5.0", features = ["std", "generic-queue-8"] }

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"
incremental = false

[profile.release]
codegen-units    = 1     # LLVM can perform better optimizations using a single thread
debug            = 2
debug-assertions = false
incremental      = false
lto              = 'fat'
opt-level        = 's'
overflow-checks  = false
